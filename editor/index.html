<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<style>
:root {
  --text: #e9e9ec;
  --muted: #8d9097;
  --card: rgb(32 34 37 / 97%);
  --edge: rgb(255 255 255 / 9%);
  --accent: #3ccfb4;
  --mono: ui-monospace, "JetBrains Mono", "DejaVu Sans Mono", monospace;
  color-scheme: dark;
}
html, body {
  margin: 0;
  height: 100%;
  background: transparent;
  overflow: hidden;
}
body {
  font: 15px/1.55 system-ui, sans-serif;
  color: var(--text);
}
.card {
  box-sizing: border-box;
  height: 100%;
  display: flex;
  flex-direction: column;
  gap: 10px;
  padding: 14px 16px 12px;
  background: var(--card);
  border: 1px solid var(--edge);
  border-radius: 12px;
}
header {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  gap: 12px;
  font-size: 12.5px;
  color: var(--muted);
  user-select: none;
}
header strong {
  color: var(--accent);
  font-weight: 600;
  font-size: 13px;
  font-variant-numeric: tabular-nums;
}
kbd {
  font: inherit;
  color: var(--text);
}
#editor {
  position: relative;
  flex: 1;
  min-height: 0;
  overflow-y: auto;
}
#editor[data-empty="true"]::before {
  content: "Escreva o comentário…";
  position: absolute;
  color: var(--muted);
  pointer-events: none;
}
.composer {
  min-height: 100%;
  white-space: pre-wrap;
  overflow-wrap: break-word;
  caret-color: var(--accent);
}
.composer:focus {
  outline: none;
}
.composer p {
  margin: 0;
}
.composer code {
  font-family: var(--mono);
  font-size: 0.92em;
  background: rgb(255 255 255 / 9%);
  border-radius: 0.3em;
  padding: 0.05em 0.25em;
}
.rich-marker {
  color: var(--muted);
  opacity: 0.75;
  font-weight: 400;
  font-style: normal;
  text-decoration: none;
  user-select: none;
  pointer-events: none;
}
.composer ul[data-type="taskList"] {
  list-style: none;
  margin: 0;
  padding: 0;
}
.composer ul[data-type="taskList"] ul[data-type="taskList"] {
  padding-left: 1.375rem;
}
.composer li[data-checked] {
  display: flex;
  align-items: flex-start;
  gap: 0.5rem;
  margin: 0;
  padding: 0;
}
.composer li[data-checked] > label {
  display: flex;
  align-items: center;
  flex: none;
  height: 1lh;
  cursor: pointer;
}
.composer li[data-checked] > label input[type="checkbox"] {
  display: block;
  margin: 0;
  width: 0.95rem;
  height: 0.95rem;
  accent-color: var(--accent);
  cursor: pointer;
}
.composer li[data-checked] > div {
  flex: 1 1 auto;
  min-width: 0;
}
.composer li[data-checked] > div > p {
  margin: 0;
}
</style>
</head>
<body>
<div class="card">
  <header>
    <strong>{title}</strong>
    <span><kbd>Enter</kbd> salva · <kbd>Shift+Enter</kbd> nova linha · <kbd>Esc</kbd> {esc}</span>
  </header>
  <div id="editor"></div>
</div>
<script>{script}</script>
</body>
</html>
