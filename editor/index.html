<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<style>
:root {
  --panel: rgb(32 34 37 / 94%);
  --text: rgb(255 255 255 / 92%);
  --muted: rgb(255 255 255 / 50%);
  --faint: rgb(255 255 255 / 16%);
  --wash: rgb(255 255 255 / 8%);
  --red: rgb(255 80 80);
  --mono: ui-monospace, "JetBrains Mono", "DejaVu Sans Mono", monospace;
  color-scheme: dark;
}
html, body {
  margin: 0;
  height: 100%;
  background: transparent;
  overflow: hidden;
}
body {
  display: flex;
  gap: 12px;
  font: 14px/1.55 system-ui, sans-serif;
  color: var(--text);
}
.panel {
  box-sizing: border-box;
  flex: 1;
  min-width: 0;
  height: 100%;
  display: flex;
  flex-direction: column;
  gap: 6px;
  padding: 6px;
  background: var(--panel);
  border-radius: 8px;
}
.bar {
  display: flex;
  align-items: center;
  gap: 6px;
  height: 36px;
  padding: 0 6px 0 12px;
  border-radius: 6px;
  background: var(--wash);
  user-select: none;
  white-space: nowrap;
}
.dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: var(--red);
  flex: none;
}
.title {
  font-weight: 600;
  font-variant-numeric: tabular-nums;
}
.state {
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  color: var(--muted);
  font-size: 12.5px;
}
.state.warn {
  color: var(--red);
}
.keys {
  flex: none;
  margin-left: auto;
  display: flex;
  gap: 4px;
  font-size: 12px;
  color: var(--muted);
}
kbd {
  font: inherit;
  padding: 2px 7px;
  border-radius: 6px;
  background: var(--wash);
}
kbd b {
  color: var(--text);
  font-weight: 500;
}
#editor {
  position: relative;
  flex: 1;
  min-height: 0;
  overflow-y: auto;
  padding: 6px 12px 8px;
}
#editor[data-empty="true"]::before {
  content: "Comentário para a IA… Markdown funciona: # título, **negrito**, - lista, ```código";
  position: absolute;
  inset: 6px 12px auto;
  color: var(--muted);
  pointer-events: none;
}
.composer-tiptap {
  position: relative;
  min-height: 100%;
  white-space: pre-wrap;
  overflow-wrap: break-word;
  caret-color: #fff;
  font-variant-ligatures: normal;
  font-feature-settings: normal;
}
.composer-tiptap:focus {
  outline: none;
}
.composer-tiptap ::selection {
  background: var(--faint);
}
.composer-tiptap p {
  margin: 0;
}
.composer-tiptap :not(pre) > code {
  font-family: var(--mono);
  font-size: 0.92em;
  background: var(--wash);
  border-radius: 0.3em;
  padding: 0.05em 0.25em;
}
.composer-tiptap pre {
  margin: 0.5rem 0;
  padding: 8px 10px;
  border-radius: 6px;
  background: rgb(0 0 0 / 28%);
  font-family: var(--mono);
  font-size: 0.9em;
  overflow-x: auto;
}
.composer-rich-marker {
  color: var(--muted);
  font-weight: 400;
  font-style: normal;
  text-decoration: none;
}
.composer-rich-marker-hidden {
  display: none;
}
.composer-tiptap :is(h1, h2, h3, h4, h5, h6) {
  margin: 0.75rem 0 0.25rem;
  font-weight: 600;
  line-height: 1.3;
  color: #fff;
}
.composer-tiptap h1 {
  font-size: 1.25rem;
}
.composer-tiptap h2 {
  font-size: 1.125rem;
}
.composer-tiptap h3 {
  font-size: 1rem;
}
.composer-tiptap :is(h4, h5, h6) {
  font-size: 0.875rem;
}
.composer-tiptap h6 {
  color: var(--muted);
}
.composer-tiptap :is(ul, ol, blockquote) {
  margin: 0.5rem 0;
}
.composer-tiptap ul {
  padding-inline-start: max(1.25rem, 2ch);
  list-style-type: disc;
}
.composer-tiptap ul ul {
  list-style-type: circle;
}
.composer-tiptap ul ul ul {
  list-style-type: square;
}
.composer-tiptap ol {
  padding-inline-start: max(1.25rem, 3ch);
  list-style-type: decimal;
}
.composer-tiptap ol > li::marker {
  font-variant-numeric: tabular-nums;
}
.composer-tiptap ol > li[data-marker]::marker {
  content: attr(data-marker) " ";
}
.composer-tiptap li::marker {
  color: var(--muted);
}
.composer-tiptap blockquote {
  border-inline-start: 2px solid var(--faint);
  padding-inline-start: 0.8rem;
  color: var(--muted);
}
.composer-tiptap hr {
  margin: 0.65rem 0;
  border: none;
  border-top: 1px solid var(--faint);
}
.composer-tiptap > :first-child,
.composer-tiptap :is(h1, h2, h3, h4, h5, h6):first-child {
  margin-top: 0;
}
.composer-tiptap > :last-child {
  margin-bottom: 0;
}
.composer-tiptap .ProseMirror-selectednode {
  outline: 2px solid var(--faint);
  outline-offset: -2px;
  border-radius: 6px;
}
.composer-tiptap ul[data-type="taskList"] {
  list-style: none;
  margin: 0;
  padding: 0;
}
.composer-tiptap ul[data-type="taskList"] ul[data-type="taskList"] {
  padding-left: 1.375rem;
}
.composer-tiptap li[data-checked] {
  display: flex;
  align-items: flex-start;
  gap: 0.5rem;
  margin: 0;
  padding: 0;
}
.composer-tiptap li[data-checked] > label {
  display: flex;
  align-items: center;
  flex: none;
  height: 1lh;
  cursor: pointer;
}
.composer-tiptap li[data-checked] > label input[type="checkbox"] {
  display: block;
  margin: 0;
  width: 0.95rem;
  height: 0.95rem;
  accent-color: #e8e8e8;
  cursor: pointer;
}
.composer-tiptap li[data-checked] > div {
  flex: 1 1 auto;
  min-width: 0;
}
.composer-tiptap li[data-checked] > div > p {
  margin: 0;
}
.history {
  flex: 0 0 300px;
}
body.solo .history {
  display: none;
}
#entries {
  flex: 1;
  min-height: 0;
  margin: 0;
  padding: 0;
  list-style: none;
  overflow-y: auto;
  display: flex;
  flex-direction: column;
  gap: 2px;
}
.entry {
  display: flex;
  border-radius: 6px;
}
.entry:hover,
.entry.active {
  background: var(--wash);
}
.entry.active {
  box-shadow: inset 0 0 0 1px var(--faint);
}
button {
  all: unset;
  cursor: pointer;
  border-radius: 6px;
}
.open {
  flex: 1;
  min-width: 0;
  display: flex;
  flex-direction: column;
  gap: 1px;
  padding: 6px 8px;
}
.head {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 12.5px;
  color: var(--muted);
  font-variant-numeric: tabular-nums;
}
.head b {
  color: var(--text);
  font-weight: 600;
}
.tag {
  padding: 0 6px;
  border-radius: 6px;
  background: var(--wash);
  font-size: 11.5px;
}
.excerpt {
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
  overflow-wrap: anywhere;
  font-size: 13px;
}
.excerpt:empty::before {
  content: "sem texto";
  color: var(--muted);
}
.delete {
  flex: none;
  width: 30px;
  display: grid;
  place-items: center;
  font-size: 17px;
  color: var(--muted);
}
.delete:hover {
  color: var(--red);
  background: var(--wash);
}
</style>
</head>
<body>
<script>window.NINO = {state};</script>
<div class="panel">
  <div class="bar">
    <span class="dot"></span>
    <span class="title" id="title"></span>
    <span class="state" id="state">gravação pausada</span>
    <span class="keys"><kbd><b>Enter</b> salva</kbd><kbd><b>Shift+Enter</b> linha</kbd><kbd><b>Esc 2×</b> cancela</kbd></span>
  </div>
  <div id="editor"></div>
</div>
<aside class="panel history">
  <div class="bar">
    <span class="title">Histórico</span>
    <span class="state">clique para editar</span>
  </div>
  <ol id="entries"></ol>
</aside>
<script>{script}</script>
</body>
</html>
